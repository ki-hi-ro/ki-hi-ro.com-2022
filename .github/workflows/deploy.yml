on:
  push:
    branches:
      - main

name: Build and Deploy

# Serialize transfers so two deployments cannot overwrite each other mid-upload.
concurrency:
  group: production-theme-deploy
  cancel-in-progress: false

jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Future reruns always deploy the current production branch.
          ref: main

      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./
          server-dir: /ki-hi-ro.com/public_html/ki-hi-ro.com-2022/wp-content/themes/ki-hi-ro.com-2022/

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            README.md
            CASE-STUDY.md
            samples/**
            review/**
            **/.local-backups/**
            **/.local-sync/**
            scripts/**
            tests/**
            SYNC.md
